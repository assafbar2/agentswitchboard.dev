<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Square signal-yellow tile, like the logo block -->
  <rect width="32" height="32" fill="#FFD400"/>
  <!-- Center hub -->
  <circle cx="16" cy="16" r="3" fill="#111111"/>
  <!-- Connection spokes — switchboard feel -->
  <line x1="16" y1="6"  x2="16" y2="13" stroke="#111111" stroke-width="2.5"/>
  <line x1="16" y1="19" x2="16" y2="26" stroke="#111111" stroke-width="2.5"/>
  <line x1="6"  y1="16" x2="13" y2="16" stroke="#111111" stroke-width="2.5"/>
  <line x1="19" y1="16" x2="26" y2="16" stroke="#111111" stroke-width="2.5"/>
  <!-- Diagonal spokes -->
  <line x1="9.5"  y1="9.5"  x2="13.6" y2="13.6" stroke="#111111" stroke-width="1.5"/>
  <line x1="22.5" y1="9.5"  x2="18.4" y2="13.6" stroke="#111111" stroke-width="1.5"/>
  <line x1="9.5"  y1="22.5" x2="13.6" y2="18.4" stroke="#111111" stroke-width="1.5"/>
  <line x1="22.5" y1="22.5" x2="18.4" y2="18.4" stroke="#111111" stroke-width="1.5"/>
</svg>
